version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rotterdammerk_app
    ports:
      - 8000:80
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://app:app@database:3306/app?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./:/var/www/html:cached
    networks:
      - app-network

  database:
    image: mysql:8.0
    container_name: rotterdammerk_db
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin ping -h localhost -u root -proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - app-network

volumes:
  database_data:

networks:
  app-network:
    driver: bridge
