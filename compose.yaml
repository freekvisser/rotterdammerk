services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: rotterdammerk_api
    ports:
      - "8000:80"
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://app:app@database:3306/rotterdammerk?serverVersion=8.0&charset=utf8mb4
    depends_on:
      database:
        condition: service_healthy
    command: >
      /bin/sh -c "php bin/console doctrine:migrations:migrate --no-interaction && apache2-foreground"
    volumes:
      - ./api:/var/www/html:cached
      - /var/www/html/vendor
      - /var/www/html/var
    networks:
      - app-network

  admin:
    build:
      context: ./docker/node
    container_name: rotterdammerk_admin
    working_dir: /app
    command: sh -c "
      npm install && 
      npm run generate-api &&
      npm run dev -- --host 0.0.0.0 &&
      "
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/admin:/app
    networks:
      - app-network

  webshop:
    build:
      context: ./docker/node
    container_name: rotterdammerk_webshop
    working_dir: /app
    command: sh -c "
      npm install && 
      npm run generate-api &&
      npm run dev -- --host 0.0.0.0
      "
    ports:
      - "3002:3002"
    volumes:
      - ./frontend/webshop:/app
    networks:
      - app-network

  database:
    image: mysql:8.0
    container_name: rotterdammerk_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: rotterdammerk
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

volumes:
  database_data:

networks:
  app-network:
    driver: bridge
